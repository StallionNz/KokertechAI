[pytest]
# NOTE: Full-suite I/O crash investigation (June 2026) — CLOSED.
# Root cause: Python 3.14.5's tighter file descriptor lifecycle causes
# cumulative fd exhaustion after ~32 test files (1,227 tests) during
# pytest's collection phase. The capture tempfile's native fd is closed
# by the runtime during the 33rd file's collection setup, regardless of
# which file is at that position.
#
# Three conftest.py mitigations cover known crash points (snap, start,
# resume), raising the threshold from ~15 to ~20 files. Beyond that,
# the crash is an upstream Python limitation (not a project bug).
#
# Workaround: run in 15-20 file batches (721 tests). All files pass
# individually and in small groups. Full-suite requires splitting.
# Upstream tracking: https://github.com/pytest-dev/pytest/issues/14528
# See conftest.py top comment and _reapply_safe_flush() for mitigations.
#
# Timer cleanup (June 2026): the shared_dashboard fixture in conftest.py
# patches setup_vram_monitor, setup_cleanup_timer, setup_consolidation_timer,
# and setup_daily_summary_timer to no-ops before Dashboard creation, preventing
# background QTimers from starting during tests. Without this, QTimer callbacks
# keep firing after tests complete and prevent the process from exiting, causing
# test files that use shared_dashboard (e.g. test_hotkey_system.py) to hang
# indefinitely until killed.
#
# closeEvent blocking (June 2026): the shared_dashboard fixture also patches
# KokertechDashboard.closeEvent to a lightweight replacement that skips all
# blocking I/O. The real closeEvent (app_lifecycle.py) performs synchronous
# worker.terminate()+wait(2000) per worker, thread.join(2s), and calls
# memory_vault.consolidate_episodic() and scan_execution_log() which can hang
# indefinitely on Windows file/DB locks. The test replacement preserves the
# _shutting_down flag and _save_window_geometry() while skipping cleanup.
#
# Strict RuntimeWarning gate: every CI run (and every local pytest
# invocation that uses this pytest.ini) will treat Python RuntimeWarning
# as a hard exception. This makes the bool-as-fd regression class
# (os.stat(True), open(True), etc.) immediately visible -- any future
# plugin or housekeeping script that accidentally passes a non-string
# typd value into os.path.*  / os.stat / open will surface as a test
# failure rather than a silent RuntimeWarning logged to execution_log.txt.
# Decoder: ``-W error::RuntimeWarning`` parses as action=error, message=any,
# category=RuntimeWarning in modern Python warning-filter syntax.
# Counterpart env var: ``PYTHONWARNINGS=error:RuntimeWarning`` (equivalent).
# Proof-of-trip test: test_runtime_warning_gate.py.
# Parallel execution: -n auto uses all available CPU cores.
# --dist loadscope groups tests by file so module-scoped fixtures
# (e.g. shared_dashboard) stay in the same worker process.
#
# Sequential fallback: if xdist is not installed, pytest ignores
# -n and --dist flags gracefully with a warning.
testpaths = tests/
addopts = -v --color=no --tb=short --durations=15 -n auto --dist loadscope -p no:pytest-qt -p no:cov -p no:cacheprovider -p no:langsmith -W error::RuntimeWarning
# NOTE: -p no:pytest-qt is required to disable pytest-qt's pytest_runtest_setup
# hook which calls set_fixture on a None request object.
#
# -p no:cov -p no:cacheprovider (July 2026): disables pytest-cov and
# cacheprovider plugins. Both plugins trigger fd exhaustion on Python 3.14.6
# during full-suite collection (120+ test files). Without this, collection
# silently hangs at "collecting ..." then exits code 2 after ~30-33 files.
# This replaces the previous --capture=no workaround which was insufficient
# for Python 3.14.6 and also caused collection output to be suppressed.
# Investigation: #4 in the 13-item cleanup sprint (July 12, 2026).
timeout = 180
# Use thread-based timeout (not signal) -- signal.SIGALRM is unreliable on
# Windows and interacts poorly with PyQt6's event loop.  Thread timeout kills
# the test thread after 300s, generous enough for Dashboard creation (~3.3s)
# AND llama.cpp model-load warm-up in the 5 KV-cache tests (~3-5s mock
# construction + cache_prompt hash work), while still catching genuine hangs
# (see test_hotkey_system.py investigation Jun 2026).
timeout_method = thread
requires_api = false

markers =
    real_vault: test needs the PRODUCTION kokertech_vault.db (default-deny vault isolation is bypassed). Should almost never be used — grep before adding.
    native_stack: tests that require pyarrow/pandas/scikit-learn native stack
    known_failure: tests with documented pre-existing failures. Suppressed by --ignore-known-failures.
    no_config_reset: opt-out from the autouse _reset_config_per_test fixture. Tests marked with this marker keep their CONFIG modifications after the test completes (next test sees modified state). Use sparingly — prefer explicit CONFIG setup in each test instead.
    real_onboarding: opt-out from the autouse _no_onboarding_modal conftest guard. For tests that exercise the real _run_onboarding_or_show flow. NOTE: the guard neuters BOTH startup modals for markerless tests (_run_onboarding_or_show AND _check_save_integrity) -- future dashboard tests need no stubs for either; contract pinned in tests/test_conftest_guards.py.

# Test-count CI gate: max drop (per-file OR total) vs the stored baseline
# before the suite is failed. Default 5 catches accidental test-file
# deletion (e.g. the tabs/*.py.pre_* cleanup scenario). Override with
# `-o test_drop_threshold=N` per invocation, or set
# KOKERTECH_UPDATE_TEST_BASELINE=1 to force a re-seed.
test_drop_threshold = 5

